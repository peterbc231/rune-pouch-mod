name: Build Mod JAR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create libs directory
        run: mkdir -p libs

      - name: Download AoA3 JAR (3.6.11)
        run: |
          echo "Downloading AoA3-1.16.5-3.6.11.jar..."
          wget -O libs/aoa3-3.6.11.jar "https://mediafilez.forgecdn.net/files/2951/383/AoA3-1.16.5-3.6.11.jar" || \
          wget -O libs/aoa3-3.6.11.jar "https://edge.forgecdn.net/files/2951/383/AoA3-1.16.5-3.6.11.jar" || \
          wget -O libs/aoa3-3.6.11.jar "https://www.curseforge.com/minecraft/mc-mods/advent-of-ascension-nevermine/download/2951383"
          ls -lh libs/

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v5
        with:
          name: rune-pouch-mod
          path: build/libs/*.jar
